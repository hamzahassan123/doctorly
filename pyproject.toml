[project]
name = "doctorly"
version = "0.1.0"
description = "Hospital outpatient appointment and patient-support platform"
readme = "README.md"
authors = [
    { name = "Hamza", email = "hamza140934@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=4.0,<5",
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "langchain>=1.0,<2",
    "langchain-google-genai>=4.0,<5",
    "langgraph>=1.0,<2",
    "langsmith>=0.1,<1",
    "opentelemetry-api>=1.36,<2",
    "opentelemetry-exporter-otlp>=1.36,<2",
    "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
    "opentelemetry-sdk>=1.36,<2",
    "pgvector>=0.4,<1",
    "pyjwt>=2.10,<3",
    "pwdlib[argon2]>=0.2.1,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic[email]>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "sentence-transformers>=5.1,<6",
    "sqlalchemy>=2.0,<3",
    "sse-starlette>=2.1,<3",
    "torch>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
doctorly = "doctorly:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.4,<9",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
