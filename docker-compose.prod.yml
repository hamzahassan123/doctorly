services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doctorly}
      POSTGRES_USER: ${POSTGRES_USER:-doctorly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doctorly} -d ${POSTGRES_DB:-doctorly}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DOCTORLY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-doctorly}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-doctorly}
      DOCTORLY_JWT_SECRET_KEY: ${DOCTORLY_JWT_SECRET_KEY}
      DOCTORLY_LLM_PROVIDER: ${DOCTORLY_LLM_PROVIDER:-google}
      DOCTORLY_LLM_MODEL: ${DOCTORLY_LLM_MODEL:-gemini-1.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-doctorly}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    environment:
      VITE_API_BASE_URL: http://api:8000

volumes:
  postgres_data:
