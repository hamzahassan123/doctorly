services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DOCTORLY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-doctorly}:${POSTGRES_PASSWORD:-doctorly}@db:5432/${POSTGRES_DB:-doctorly}
      DOCTORLY_JWT_SECRET_KEY: ${DOCTORLY_JWT_SECRET_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: doctorly-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doctorly}
      POSTGRES_USER: ${POSTGRES_USER:-doctorly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doctorly}
    ports:
      - "5432:5432"
    volumes:
      - doctorly_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  doctorly_db_data:
